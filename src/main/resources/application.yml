spring:
  application:
    name: medisalud

  datasource:
    url: jdbc:h2:mem:medisalud;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# Parametros de negocio de RN-01 (horario de atencion) y RN-05 (penalizacion por
# cancelacion tardia). Externalizados aqui para que puedan ajustarse por ambiente
# (application-prod.yml, variables de entorno, etc.) sin recompilar ni tocar el
# codigo de CitaServiceImpl/HorarioAtencionPolicy. Ver justificacion en el README.
medisalud:
  citas:
    franja-minutos: 30
    horario:
      apertura: "08:00"
      cierre-entre-semana: "18:00"
      cierre-sabado: "13:00"
    penalizacion:
      horas-minimas-cancelacion: 2
      dias-ventana: 30
      max-permitidas: 3
